services:
  eliment-web:
    container_name: eliment_web
    image: registry.mplab.io/eliment-web:latest
    restart: always
    env_file: .env
    dockerfile: .Dockerfile
    networks:
      - web_network
    volumes:
      - /mnt/media/images:/app/apps/media/images
    # depends_on:
    #   - fastapi-app
    ports:
      - "80:80"

  eliment-cli:
    container_name: eliment-cli
    image: registry.mplab.io/eliment-cli:latest
    restart: always
    env_file: .env
    networks:
     - web_network
    dockerfile: .CliDockerfile
    command: python manage.py kafka_consumer

networks:
  web_network:
    external: true
    name: web_network
