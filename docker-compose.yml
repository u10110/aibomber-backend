services:
  bomber-web:
    container_name: bomber-web
    build:
      dockerfile: ./Dockerfile
      context: ./
    restart: always
    env_file: .env
    ports:
      - "8383:80"
    networks:
      - default
    volumes:
      - ./:/app/
      - /tmp/:/tmp/  
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: gunicorn --config gunicorn-cfg.py core.wsgi --workers 1 --threads 1 --timeout 300 --graceful-timeout 300 --max-requests 1000 --max-requests-jitter 50


  cli-new-message-send:
    container_name: cli-new-message-send
    build:
      dockerfile: ./Dockerfile
      context: ./
    restart: always
    env_file: .env
    command: python manage.py send_messages
    logging:
      driver: "json-file"
      options:
        max-size: "1000m"
        max-file: "3"
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"

  cli-kafka-message-reply:
    container_name: cli-kafka-message-reply
    build:
      dockerfile: ./Dockerfile
      context: ./
    restart: always
    env_file: .env
    command: python manage.py reply_messages
    logging:
      driver: "json-file"
      options:
        max-size: "1000m"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450
  database:
    external:
      name: scoring_default


