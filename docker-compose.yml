services:
  appseed-app:
    container_name: appseed_app
    image: registry.mplab.io/eliment-web:latest
    restart: always
    env_file: .env
    networks:
      - web_network
    volumes:
      - /mnt/media/images:/app/apps/media/images
      - ./sessions:/app/sessions
    depends_on:
      - fastapi_app
    environment:
      - FASTAPI_URL=http://fastapi_app:8001
    ports:
      - "80:80"

  fastapi-app:
    container_name: fastapi_app
    build:
      context: ./fastapi
    restart: always
    networks:
      - web_network
    volumes:
      - ./sessions:/app/sessions
    ports:
      - "8001:8001"

networks:
  web_network:
    external: true
    name: web_network
