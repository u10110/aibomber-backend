services:
  neuro-backend:
    container_name: neuro-backend
    image: registry.mplab.io/neuro-backend:latest
    restart: always
    env_file: .env
    ports:
      - "80:80"
    command: gunicorn --config gunicorn-cfg.py core.wsgi --workers 12 --threads 12 --timeout 300 --graceful-timeout 300 --max-requests 1000 --max-requests-jitter 50


  eliment-cli-new-message-send:
    container_name: eliment-cli-new-message-send
    image: registry.mplab.io/neuro-backend:latest
    restart: always
    env_file: .env
    command: python manage.py send_telegramm_messages
    logging:
      driver: "json-file"
      options:
        max-size: "1000m"
        max-file: "3"

  eliment-cli-kafka-message-reply:
    container_name: eliment-cli-kafka-message-reply
    image: registry.mplab.io/neuro-backend:latest
    restart: always
    env_file: .env
    command: python manage.py reply_telegram_messages
    logging:
      driver: "json-file"
      options:
        max-size: "1000m"
        max-file: "3"

