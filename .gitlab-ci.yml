stages:
    - build
    - deploy
    - prod

variables:
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1

before_script:
  - docker login -u $NEXUS_REGISTRY_USER -p $NEXUS_REGISTRY_PASSWD registry.mplab.io

cache:
  paths:
    - fastapi/sessions/

build:
  allow_failure: true
  stage: build
  image: docker
  tags: [infra]
  only:
  - development
  variables:
    CONTAINER_IMAGE: registry.mplab.io/neuro-backend:${CI_COMMIT_SHORT_SHA}
    CONTAINER_IMAGE_LATEST: registry.mplab.io/neuro-backend:latest
  script:
  - docker build -t ${CONTAINER_IMAGE} .
  - docker tag ${CONTAINER_IMAGE} ${CONTAINER_IMAGE_LATEST}
  - docker push ${CONTAINER_IMAGE_LATEST}
  - docker system prune -f -a


build:prod:
  allow_failure: true
  stage: build
  image: docker
  tags: [infra]
  when: manual
  only:
    - main
  variables:
    CONTAINER_IMAGE: registry.mplab.io/neuro-backend:${CI_COMMIT_SHORT_SHA}
    CONTAINER_IMAGE_LATEST: registry.mplab.io/neuro-backend:latest
  script:
    - docker build -t ${CONTAINER_IMAGE} .
    - docker tag ${CONTAINER_IMAGE} ${CONTAINER_IMAGE_LATEST}
    - docker push ${CONTAINER_IMAGE_LATEST}
    - docker system prune -f -a

