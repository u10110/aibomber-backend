prod:eliment-cli-kafka-message-reply:
  stage: prod
  tags: [neuro-app-02]
  when: manual
  image:
    name: docker/compose
    entrypoint: ["/bin/sh", "-c"]
  script:
    # - docker network create web_network || true
    - docker compose -f docker-compose.yml -p eliment-cli-kafka-message-reply down --timeout 10
    - docker compose -f docker-compose.yml  pull eliment-cli-kafka-message-reply
    - docker compose -f docker-compose.yml  up -d eliment-cli-kafka-message-reply


prod:eliment-cli-new-message-send:
  stage: prod
  tags: [neuro-app-02]
  when: manual
  image:
    name: docker/compose
    entrypoint: ["/bin/sh", "-c"]
  script:
    - docker network create web_network || true
    - docker compose -f docker-compose.yml -p eliment-cli-new-message-send down --timeout 10
    - docker compose -f docker-compose.yml  pull eliment-cli-new-message-send
    - docker compose -f docker-compose.yml  up -d eliment-cli-new-message-send

prod:
  stage: prod
  tags: [neuro-app-02]
  when: manual
  image:
    name: docker/compose
    entrypoint: ["/bin/sh", "-c"]
  script:
    - docker network create web_network || true
    - docker compose -f docker-compose.yml -p neuro-backend down --timeout 10
    - docker compose -f docker-compose.yml  pull neuro-backend
    - docker compose -f docker-compose.yml  up -d neuro-backend


deploy_dev:
  stage: deploy
  tags: [eliment-dev]
  only:
    - development
  image:
    name: docker/compose
    entrypoint: ["/bin/sh", "-c"]
  script:
    - IMAGE_TAG=latest docker compose -f docker-compose-dev.yml -p neuro-backend down --timeout 10
    - IMAGE_TAG=latest docker compose -f docker-compose-dev.yml  pull neuro-backend
    - IMAGE_TAG=latest docker compose -f docker-compose-dev.yml  up -d neuro-backend