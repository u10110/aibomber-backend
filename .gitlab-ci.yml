stages:
    - build
    - deploy
    - prod

variables:
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_BUILDKIT: 1

before_script:
  - docker login -u $NEXUS_REGISTRY_USER -p $NEXUS_REGISTRY_PASSWD registry.mplab.io
  - mkdir -p fastapi/sessions
  - echo "Preserving sessions directory"

cache:
  paths:
    - fastapi/sessions/

build:
  allow_failure: true
  stage: build
  image: docker
  only:
  - main
  # when: manual
  variables:
    CONTAINER_IMAGE: registry.mplab.io/eliment-web:${CI_COMMIT_SHORT_SHA}
    CONTAINER_IMAGE_LATEST: registry.mplab.io/eliment-web:latest
  script:
  - docker build -t ${CONTAINER_IMAGE} .
  - docker tag ${CONTAINER_IMAGE} ${CONTAINER_IMAGE_LATEST}
  - docker push ${CONTAINER_IMAGE_LATEST}
  - docker system prune -f -a

build:eliment-cli-kafka-message-reply:
  #allow_failure: true
  stage: build
  image: docker
  # when: manual
  only:
    - main
  variables:
    CONTAINER_IMAGE: registry.mplab.io/eliment-cli-kafka-message-reply:${CI_COMMIT_SHORT_SHA}
    CONTAINER_IMAGE_LATEST: registry.mplab.io/eliment-cli-kafka-message-reply:latest
  script:
    - docker build -f Dockerfile -t ${CONTAINER_IMAGE} .
    - docker tag ${CONTAINER_IMAGE} ${CONTAINER_IMAGE_LATEST}
    - docker push ${CONTAINER_IMAGE_LATEST}
    - docker system prune -f -a

build:eliment-cli-new-message-send:
  #allow_failure: true
  stage: build
  image: docker
  # when: manual
  only:
    - main
  variables:
    CONTAINER_IMAGE: registry.mplab.io/eliment-cli-new-message-send:${CI_COMMIT_SHORT_SHA}
    CONTAINER_IMAGE_LATEST: registry.mplab.io/eliment-cli-new-message-send:latest
  script:
    - docker build -f Dockerfile -t ${CONTAINER_IMAGE} .
    - docker tag ${CONTAINER_IMAGE} ${CONTAINER_IMAGE_LATEST}
    - docker push ${CONTAINER_IMAGE_LATEST}
    - docker system prune -f -a


prod:eliment-cli-kafka-message-reply:
  stage: prod
  tags: [app-ea]
  when: manual
  image:
    name: docker/compose
    entrypoint: ["/bin/sh", "-c"]
  script:
    - docker network create web_network || true
    - docker compose -f docker-compose.yml -p eliment-cli-kafka-message-reply down --timeout 10
    - docker compose -f docker-compose.yml  pull eliment-cli-kafka-message-reply
    - docker compose -f docker-compose.yml  up -d eliment-cli-kafka-message-reply
    - docker image prune -a -f
    - docker builder prune -f
    - docker image prune -a -f


prod:eliment-cli-new-message-send:
  stage: prod
  tags: [app-ea]
  when: manual
  image:
    name: docker/compose
    entrypoint: ["/bin/sh", "-c"]
  script:
    - docker network create web_network || true
    - docker compose -f docker-compose.yml -p eliment-cli-new-message-send down --timeout 10
    - docker compose -f docker-compose.yml  pull eliment-cli-new-message-send
    - docker compose -f docker-compose.yml  up -d eliment-cli-new-message-send
    - docker image prune -a -f
    - docker builder prune -f
    - docker image prune -a -f

prod:
  stage: prod
  tags: [app-ea]
  when: manual
  image:
    name: docker/compose
    entrypoint: ["/bin/sh", "-c"]
  script:
    - docker network create web_network || true
    - docker compose -f docker-compose.yml -p eliment-web down --timeout 10
    - docker compose -f docker-compose.yml  pull eliment-web
    - docker compose -f docker-compose.yml  up -d eliment-web
    - docker image prune -a -f
    - docker builder prune -f
    - docker image prune -a -f


deploy_dev:
  stage: deploy
  tags: [eliment-dev]
  only:
    - main
  # when: manual
  image:
    name: docker/compose
    entrypoint: ["/bin/sh", "-c"]
  script:
    - IMAGE_TAG=latest docker compose -f docker-compose-dev.yml -p eliment-web down --timeout 10
    - IMAGE_TAG=latest docker compose -f docker-compose-dev.yml  pull eliment-web
    - IMAGE_TAG=latest docker compose -f docker-compose-dev.yml  up -d eliment-web 
    - docker image prune -a -f
    - docker builder prune -f