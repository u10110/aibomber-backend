{% extends 'layouts/base.html' %}

{% block title %}Редактировать список получателей{% endblock title %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h5>Редактировать список: {{ recipient.title }}</h5>
                </div>
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="title" class="form-label">Название:</label>
                            {{ form.title }}
                        </div>
                        <div class="mb-3">
                            <label for="tg_ids" class="form-label">ТГ ИД список:</label>
                            {{ form.tg_ids }}
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn bg-gradient-primary">Сохранить изменения</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
